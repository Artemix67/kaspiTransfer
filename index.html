<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправить деньги</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .phone-box {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 12px;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .kaspi-btn {
            background: #FF6B00;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .kaspi-btn:hover {
            background: #E55A00;
        }

        .success-message {
            display: none;
            background: #4CAF50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }

        .instructions {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 25px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💳</div>
        <h1>Отправить деньги</h1>
        <p class="subtitle">Скопируйте номер и переведите через Kaspi</p>

        <div class="phone-box" id="phoneNumber">
            7778002040
        </div>

        <button class="copy-btn" onclick="copyToClipboard()">
            📋 Копировать номер
        </button>

        <button class="kaspi-btn" onclick="openKaspi()">
            🟠 Открыть Kaspi
        </button>

        <div class="success-message" id="successMessage">
            ✓ Номер скопирован!
        </div>

        <div class="instructions">
            <strong>Инструкция:</strong><br>
            1. Нажмите "Копировать номер"<br>
            2. Откройте приложение Kaspi<br>
            3. Вставьте номер и отправьте деньги
        </div>
    </div>

    <script>
        // Получить номер из URL (например: ?phone=77001234567)
        const params = new URLSearchParams(window.location.search);
        const phone = params.get('phone');

        if (phone) {
            document.getElementById('phoneNumber').textContent = phone;
        } else {
            // Если номер не передан в URL, показать это сообщение
            document.getElementById('phoneNumber').textContent = '❌ Ошибка: номер не найден';
            document.getElementById('phoneNumber').style.color = '#d32f2f';
        }

        function copyToClipboard() {
            const phoneNumber = document.getElementById('phoneNumber').textContent;
            if (phoneNumber.includes('❌')) {
                alert('Неверная ссылка! Номер телефона не указан.');
                return;
            }
            navigator.clipboard.writeText(phoneNumber).then(() => {
                const message = document.getElementById('successMessage');
                message.style.display = 'block';
                setTimeout(() => {
                    message.style.display = 'none';
                }, 2000);
            });
        }

        function openKaspi() {
            window.open('https://kaspi.kz', '_blank');
        }
    </script>
</body>
</html>
